name: Build AbuQaoud Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AbuQaoudAndroid_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extract project
        run: |
          unzip -q AbuQaoudAndroid_Project.zip -d buildsrc
          test -f buildsrc/AbuQaoudAndroid/app/build.gradle.kts

      - name: Build APK
        working-directory: buildsrc/AbuQaoudAndroid
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuQaoud-Android-APK
          path: buildsrc/AbuQaoudAndroid/app/build/outputs/apk/debug/app-debug.apk
