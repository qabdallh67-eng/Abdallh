name: Build AbuQaoud Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AbuQaoudAndroid_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK Manager was not found."
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Found SDK Manager: $SDKMANAGER"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check project files
        shell: bash
        run: |
          if [ ! -f AbuQaoudAndroid_Project.zip ]; then
            echo "ERROR: AbuQaoudAndroid_Project.zip is missing."
            exit 1
          fi

          unzip -q AbuQaoudAndroid_Project.zip -d buildsrc

          if [ ! -d buildsrc/AbuQaoudAndroid ]; then
            echo "ERROR: AbuQaoudAndroid folder was not found inside the ZIP."
            find buildsrc -maxdepth 3 -type f | head -100
            exit 1
          fi

          cd buildsrc/AbuQaoudAndroid

          test -f app/build.gradle.kts
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "Project files checked successfully."

      - name: Build APK
        working-directory: buildsrc/AbuQaoudAndroid
        shell: bash
        run: |
          bash ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuQaoud-Android-APK
          path: buildsrc/AbuQaoudAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
