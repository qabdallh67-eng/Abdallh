name: Build AbuQaoud Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AbuQaoudAndroid_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract project
        run: |
          test -f AbuQaoudAndroid_Project.zip
          unzip -q AbuQaoudAndroid_Project.zip -d buildsrc
          test -f buildsrc/AbuQaoudAndroid/gradle/wrapper/gradle-wrapper.jar
          test -f buildsrc/AbuQaoudAndroid/app/build.gradle.kts

      - name: Build APK
        working-directory: buildsrc/AbuQaoudAndroid
        run: |
          java -classpath gradle/wrapper/gradle-wrapper.jar \
          org.gradle.wrapper.GradleWrapperMain \
          --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuQaoud-Android-APK
          path: buildsrc/AbuQaoudAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
